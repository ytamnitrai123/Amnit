<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>India Seva Service</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f7fb;
  text-align:center;
}

header{
  background:#1769ff;
  color:white;
  padding:25px;
  font-size:28px;
  font-weight:bold;
}

.box{
  background:white;
  margin:30px 20px;
  padding:25px;
  border-radius:15px;
}

input,select,button{
  width:90%;
  padding:14px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  background:#1769ff;
  color:white;
  border:0;
  font-size:17px;
}
</style>
</head>

<body>

<header>🇮🇳 India Seva Service</header>

<div class="box">

<h2>Online Perchi / Appointment</h2>

<input id="name" placeholder="अपना नाम लिखें">

<select id="place">
<option>Hospital</option>
<option>School</option>
<option>Clinic</option>
<option>Other</option>
</select>

<input id="date" type="date">

<button onclick="book()">Perchi Submit करें</button>

<p id="result"></p>

</div>

<script>
function book(){

let name=document.getElementById("name").value;
let place=document.getElementById("place").value;
let date=document.getElementById("date").value;

if(!name || !date){
alert("नाम और तारीख भरें");
return;
}

document.getElementById("result").innerHTML=
"✅ Perchi request submit हो गई<br>नाम: "+name+
"<br>स्थान: "+place+
"<br>तारीख: "+date;
}
</script>

</body>
</html>
